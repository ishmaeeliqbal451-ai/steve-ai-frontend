<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve.AI - Diana's Gym Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .chat-header {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .chat-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.typing {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
        }

        .chat-input-container {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: background 0.3s;
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.15);
        }

        .send-button {
            padding: 14px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            padding: 10px 20px;
            background: rgba(0, 255, 0, 0.1);
            color: #4ade80;
            font-size: 0.8rem;
            text-align: center;
        }

        .status-bar.error {
            background: rgba(255, 0, 0, 0.1);
            color: #f87171;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>💪 Steve.AI</h1>
            <p>Diana's Gym Virtual Assistant</p>
        </div>

        <div class="status-bar" id="status">Connected to Steve.AI</div>

        <div class="chat-messages" id="messages">
            <div class="message assistant">
                Hi! I'm Steve, Diana's Gym virtual assistant. I can help you with opening hours, pricing, classes, and
                booking gym tours. How can I help you today?
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" class="chat-input" id="userInput" placeholder="Ask me anything..."
                onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="send-button" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://ishmaeeliqbal451--steve-ai-chat.modal.run';
        const SESSION_ID = 'web-' + Math.random().toString(36).substr(2, 9);

        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBar = document.getElementById('status');

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant typing';
            typingDiv.textContent = 'Steve is typing...';
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                statusBar.textContent = 'Sending...';
                statusBar.className = 'status-bar';

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: SESSION_ID,
                        message: message
                    })
                });

                const data = await response.json();
                typingDiv.remove();

                if (data.reply) {
                    addMessage(data.reply, 'assistant');
                    statusBar.textContent = 'Connected to Steve.AI';
                    statusBar.className = 'status-bar';
                } else if (data.error) {
                    addMessage('Sorry, something went wrong. Please try again.', 'assistant');
                    statusBar.textContent = 'Error: ' + data.error;
                    statusBar.className = 'status-bar error';
                }
            } catch (error) {
                typingDiv.remove();
                addMessage('Sorry, I couldn\'t connect. Please try again.', 'assistant');
                statusBar.textContent = 'Connection error';
                statusBar.className = 'status-bar error';
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Focus input on load
        userInput.focus();
    </script>
</body>

</html>
